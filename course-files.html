      <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <span class="brand-name"><a href="./index.html">UniCourse</a></span>
    </div>

    <ul class="nav-menu">
      <li><a href="index.html" class="nav-link active">المواد</a></li>
      <li><a href="./teachers.html" class="nav-link">اعضاء هيئة التدريس</a></li>

      <li><a href="development.html" class="nav-link">التطوير الذاتي</a></li>
      <li>

          لوحة الإدارة
        </a>
      </li>
    </ul>
  </div>
</nav>
  <main>
    <section class="course-header-section">
      <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          العودة للمواد
        </button>

        <div class="course-header-info">
          <div class="course-icon-large">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>

          <div>
            <p class="course-code-large" id="courseCode"></p>
            <h1 class="course-name-large" id="courseName"></h1>
            <p class="course-description-large" id="courseDescription"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="files-section">
      <div class="container">
        <div class="files-header">
          <h2 class="section-title">الملفات المتاحة</h2>
        </div>

        <div id="filesList" class="files-list"></div>
      </div>
    </section>

 <footer class="site-footer">
